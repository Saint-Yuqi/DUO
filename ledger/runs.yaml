# Weights: `persistent: false` means the path is on a container-local disk (/tmp or /root on PAI-DSW) and vanishes on restart.
# To add a run: copy an entry, fill it, run `python ledger/build.py`, commit, push (scripts/push_remotes.sh).
# Style: keep nested dicts in block form with quoted strings (flow mappings {a: b} break on commas / braces inside values).
