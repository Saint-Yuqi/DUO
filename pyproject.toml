[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duo-head"
version = "0.1.0"
description = "Duo: arm-factorised, gated two-stream action head for bimanual policies, plus the experiment ledger"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["duo", "duo.*", "ledger"]
